
name: Build Fidel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save Firebase Configuration
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/logo.png
          test -f android/app/google-services.json
          mkdir -p "$RUNNER_TEMP/fidel"
          cp android/app/google-services.json "$RUNNER_TEMP/fidel/google-services.json"
          rm -rf android

      - name: Generate Android Project
        run: |
          set -e
          flutter create --platforms=android --org com.fidel.app .
          mkdir -p android/app
          cp "$RUNNER_TEMP/fidel/google-services.json" android/app/google-services.json

      - name: Configure Firebase
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = [
              c["client_info"]["android_client_info"]["package_name"]
              for c in config.get("client", [])
              if "android_client_info" in c.get("client_info", {})
          ]

          if "com.fidel.app" not in packages:
              raise SystemExit("Firebase package name must be com.fidel.app")

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          for path, is_settings in [(settings, True), (app, False)]:
              content = path.read_text()

              if "com.google.gms.google-services" not in content:
                  if path.suffix == ".kts":
                      line = (
                          'id("com.google.gms.google-services") '
                          'version "4.4.2" apply false'
                          if is_settings
                          else 'id("com.google.gms.google-services")'
                      )
                  else:
                      line = (
                          "id 'com.google.gms.google-services' "
                          "version '4.4.2' apply false"
                          if is_settings
                          else "id 'com.google.gms.google-services'"
                      )

                  match = re.search(r'plugins\s*\{', content)
                  if not match:
                      raise SystemExit(f"plugins block not found: {path}")

                  content = (
                      content[:match.end()]
                      + "\n    " + line
                      + content[match.end():]
                  )

              if not is_settings:
                  if path.suffix == ".kts":
                      content, count = re.subn(
                          r'applicationId\s*=\s*["\'][^"\']+["\']',
                          'applicationId = "com.fidel.app"',
                          content,
                          count=1
                      )
                      if count == 0:
                          content = re.sub(
                              r'defaultConfig\s*\{',
                              'defaultConfig {\n        applicationId = "com.fidel.app"',
                              content,
                              count=1
                          )
                  else:
                      content, count = re.subn(
                          r'applicationId\s+["\'][^"\']+["\']',
                          'applicationId "com.fidel.app"',
                          content,
                          count=1
                      )
                      if count == 0:
                          content = re.sub(
                              r'defaultConfig\s*\{',
                              'defaultConfig {\n        applicationId "com.fidel.app"',
                              content,
                              count=1
                          )

              path.write_text(content)

          print("Firebase configuration completed successfully.")
          PY

      - name: Configure Release Signing
        env:
          FIDEL_KEYSTORE_BASE64: ${{ secrets.FIDEL_KEYSTORE_BASE64 }}
          FIDEL_STORE_PASSWORD: ${{ secrets.FIDEL_STORE_PASSWORD }}
          FIDEL_KEY_PASSWORD: ${{ secrets.FIDEL_KEY_PASSWORD }}
          FIDEL_KEY_ALIAS: ${{ secrets.FIDEL_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$FIDEL_KEYSTORE_BASE64"
          test -n "$FIDEL_STORE_PASSWORD"
          test -n "$FIDEL_KEY_PASSWORD"
          test -n "$FIDEL_KEY_ALIAS"

          printf '%s' "$FIDEL_KEYSTORE_BASE64" | base64 --decode > android/app/fidel-upload.jks
          test -s android/app/fidel-upload.jks

          cat > android/key.properties <<EOF
          storePassword=$FIDEL_STORE_PASSWORD
          keyPassword=$FIDEL_KEY_PASSWORD
          keyAlias=$FIDEL_KEY_ALIAS
          storeFile=fidel-upload.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          def find_block_end(content, opening):
              depth = 0
              for i in range(opening, len(content)):
                  if content[i] == "{":
                      depth += 1
                  elif content[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Unclosed Gradle block")

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              content = path.read_text()

              for imp in (
                  "import java.util.Properties",
                  "import java.io.FileInputStream"
              ):
                  if imp not in content:
                      content = imp + "\n" + content

              properties = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

              if "val keystoreProperties = Properties()" not in content:
                  match = re.search(r'(?m)^android\s*\{', content)
                  if not match:
                      raise SystemExit("Android block not found")
                  content = content[:match.start()] + properties + content[match.start():]

              signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """

              if 'create("release")' not in content:
                  match = re.search(r'(?m)^(\s*)buildTypes\s*\{', content)
                  if not match:
                      raise SystemExit("buildTypes block not found")
                  content = content[:match.start()] + signing + content[match.start():]

              bt = re.search(r'(?m)^(\s*)buildTypes\s*\{', content)
              bt_open = content.find("{", bt.start())
              bt_end = find_block_end(content, bt_open)

              release = re.search(
                  r'(?m)^(\s*)release\s*\{',
                  content[bt_open + 1:bt_end]
              )
              if not release:
                  raise SystemExit("Release build type not found")

              release_start = bt_open + 1 + release.start()
              release_open = content.find("{", release_start)
              release_end = find_block_end(content, release_open)

              indent = release.group(1) + "    "
              block = content[release_open + 1:release_end]

              block = re.sub(
                  r'(?m)^[ \t]*(?://\s*)?signingConfig\s*=.*(?:\n|$)',
                  '',
                  block
              )

              new_line = '\n' + indent + 'signingConfig = signingConfigs.getByName("release")'
              content = (
                  content[:release_open + 1]
                  + new_line
                  + block
                  + content[release_end:]
              )

          elif groovy.exists():
              path = groovy
              content = path.read_text()

              for imp in (
                  "import java.util.Properties",
                  "import java.io.FileInputStream"
              ):
                  if imp not in content:
                      content = imp + "\n" + content

              properties = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

              if "def keystoreProperties = new Properties()" not in content:
                  match = re.search(r'(?m)^android\s*\{', content)
                  if not match:
                      raise SystemExit("Android block not found")
                  content = content[:match.start()] + properties + content[match.start():]

              signing = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """

              if "signingConfigs {" not in content:
                  match = re.search(r'(?m)^(\s*)buildTypes\s*\{', content)
                  if not match:
                      raise SystemExit("buildTypes block not found")
                  content = content[:match.start()] + signing + content[match.start():]

              bt = re.search(r'(?m)^(\s*)buildTypes\s*\{', content)
              bt_open = content.find("{", bt.start())
              bt_end = find_block_end(content, bt_open)

              release = re.search(
                  r'(?m)^(\s*)release\s*\{',
                  content[bt_open + 1:bt_end]
              )
              if not release:
                  raise SystemExit("Release build type not found")

              release_start = bt_open + 1 + release.start()
              release_open = content.find("{", release_start)
              release_end = find_block_end(content, release_open)

              indent = release.group(1) + "    "
              block = content[release_open + 1:release_end]

              block = re.sub(
                  r'(?m)^[ \t]*(?://\s*)?signingConfig\s+.*(?:\n|$)',
                  '',
                  block
              )

              new_line = '\n' + indent + 'signingConfig signingConfigs.release'
              content = (
                  content[:release_open + 1]
                  + new_line
                  + block
                  + content[release_end:]
              )

          else:
              raise SystemExit("Android Gradle file not found")

          path.write_text(content)
          print("Fidel release signing configured successfully.")
          PY

      - name: Get SHA Fingerprints
        run: |
          cd android
          ./gradlew signingReport

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Fidel APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/fidel-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fidel-android-apk
          path: fidel-release.apk
