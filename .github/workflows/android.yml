

name: Build Fidel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Fidel App
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/logo.png
          flutter create --platforms=android --org com.fidel.app .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/fidel-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fidel-android-apk
          path: fidel-release.apk
