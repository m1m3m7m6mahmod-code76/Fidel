
name: Build Fidel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save Firebase Configuration
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/logo.png
          test -f android/app/google-services.json
          mkdir -p "$RUNNER_TEMP/fidel"
          cp android/app/google-services.json "$RUNNER_TEMP/fidel/google-services.json"
          rm -rf android

      - name: Generate Android Project
        run: |
          flutter create --platforms=android --org com.fidel.app .
          mkdir -p android/app
          cp "$RUNNER_TEMP/fidel/google-services.json" android/app/google-services.json

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = [
              c["client_info"]["android_client_info"]["package_name"]
              for c in config.get("client", [])
              if "android_client_info" in c.get("client_info", {})
          ]
          if "com.fidel.app" not in packages:
              raise SystemExit("Firebase package name must be com.fidel.app")

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle")

          for path, is_settings in [(settings, True), (app, False)]:
              content = path.read_text()

              if "com.google.gms.google-services" not in content:
                  if path.suffix == ".kts":
                      line = (
                          'id("com.google.gms.google-services") '
                          'version "4.4.2" apply false'
                          if is_settings
                          else 'id("com.google.gms.google-services")'
                      )
                  else:
                      line = (
                          "id 'com.google.gms.google-services' "
                          "version '4.4.2' apply false"
                          if is_settings
                          else "id 'com.google.gms.google-services'"
                      )

                  match = re.search(r'plugins\s*\{', content)
                  if not match:
                      raise SystemExit(f"plugins block not found: {path}")

                  content = (
                      content[:match.end()]
                      + "\n    " + line
                      + content[match.end():]
                  )

              if not is_settings:
                  if path.suffix == ".kts":
                      content, count = re.subn(
                          r'applicationId\s*=\s*["\'][^"\']+["\']',
                          'applicationId = "com.fidel.app"',
                          content,
                          count=1
                      )
                      if count == 0:
                          content = re.sub(
                              r'defaultConfig\s*\{',
                              'defaultConfig {\n        applicationId = "com.fidel.app"',
                              content,
                              count=1
                          )
                  else:
                      content, count = re.subn(
                          r'applicationId\s+["\'][^"\']+["\']',
                          'applicationId "com.fidel.app"',
                          content,
                          count=1
                      )
                      if count == 0:
                          content = re.sub(
                              r'defaultConfig\s*\{',
                              'defaultConfig {\n        applicationId "com.fidel.app"',
                              content,
                              count=1
                          )

              path.write_text(content)

          print("Firebase configuration completed successfully.")
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build Fidel APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/fidel-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fidel-android-apk
          path: fidel-release.apk
