name: Build Fidel APK 

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract and build
        run: |
          mkdir extracted
          unzip -q fidel_app_android_online.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name pubspec.yaml -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/fidel-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fidel-android-apk
          path: fidel-release.apk
